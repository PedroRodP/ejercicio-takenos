# Health
quarkus.smallrye-health.liveness-path=/manage/health
quarkus.smallrye-health.readiness-path=/manage/health

# Jackson
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.write-dates-as-timestamps=false
mp.openapi.extensions.smallrye.property-naming-strategy=com.fasterxml.jackson.databind.PropertyNamingStrategies$SnakeCaseStrategy

# OpenAPI
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Investment Position API
quarkus.smallrye-openapi.info-version=v1
quarkus.smallrye-openapi.info-description=Simulates buys, sells and position of a user's investment account (in memory)
