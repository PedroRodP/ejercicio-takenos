plugins {
    id 'java'
    id 'groovy'
    id 'io.quarkus'
    id 'org.unbroken-dome.test-sets' version '4.1.0'
}

repositories {
    mavenCentral()
    mavenLocal()
}

testSets {
    acceptanceTest
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")

    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-smallrye-health'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Unit tests: Spock
    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    testImplementation 'org.apache.groovy:groovy:4.0.22'
    testRuntimeOnly 'net.bytebuddy:byte-buddy'
    testRuntimeOnly 'org.objenesis:objenesis:3.3'

    // Acceptance tests: @QuarkusTest written in Groovy + RestAssured
    acceptanceTestImplementation 'io.quarkus:quarkus-junit5'
    acceptanceTestImplementation 'io.quarkiverse.groovy:quarkus-groovy-junit5:3.14.0'
    acceptanceTestImplementation 'io.rest-assured:rest-assured'
    acceptanceTestImplementation 'org.apache.groovy:groovy:4.0.22'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

test {
    useJUnitPlatform()
}

acceptanceTest {
    useJUnitPlatform()
    systemProperty 'java.util.logging.manager', 'org.jboss.logmanager.LogManager'
}
